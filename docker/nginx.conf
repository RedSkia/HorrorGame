# Serves the Unity web build; no browser caching, so a new build shows up on a normal reload.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    # Unity's compressed files (gzip + decompression fallback): plain binary, the loader unpacks them.
    location ~ \.unityweb$ {
        add_header Cache-Control "no-store";
        default_type application/octet-stream;
    }
}
